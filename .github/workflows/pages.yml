# Publishes the study site to GitHub Pages: https://codexoperator.github.io/math-viz/
# Runs on every push to the study branch except work-in-progress commits (message starting with
# "WIP"), and only when the unit tests pass, so the published site is always the last good build.
# The built site is force-pushed as a single commit to the gh-pages branch, which Pages serves.
name: Publish to GitHub Pages

on:
  push:
    branches: [claude/compassionate-ptolemy-9g4oh4, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'WIP') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build the static site
        run: node tools/publish/build-site.mjs --out build/site
      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to https://codexoperator.github.io/math-viz/ (Pages must be set to serve the gh-pages branch)."
