<!doctype html><html lang="en" data-layout="stacked"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="shared/house.css"/><script src="shared/gsap.min.js"></script><script src="shared/stack.js"></script>
<style>

:root{--bg:#0d121c;--panel:#151c2b;--fg:#e9edf5;--muted:#a6b0c3;--line:#2b3650;--rule:#2b3650;--y:#e3b341;
 --cart:#62adf2;--polar:#ff9d5c;--input:#3fd0a0;--output:#e48fd2;--grid:#2b3650;--axis:#7480a0;--ghost:.35}
html[data-theme=light]{--bg:#f6f3ec;--panel:#ffffff;--fg:#1a2230;--muted:#515b6c;--line:#d8d2c4;--rule:#d8d2c4;
 --cart:#0b63ad;--polar:#a84300;--input:#006e53;--output:#9d3a8a;--grid:#e6e0d3;--axis:#757d8d;--y:#845b00}
.ln2{position:absolute;left:560px;width:684px;font:26px/1.25 "DV";white-space:nowrap;color:var(--fg)}
.ln2.m{color:var(--muted)} .ln2.s{font-size:24px}
.lbl{position:absolute;font:24px/1 "DVM";white-space:nowrap;color:var(--fg);transform:translate(-50%,-50%)}
.in{color:var(--input)} .out{color:var(--output)} .po{color:var(--polar)} .ca{color:var(--cart)}
svg.plane{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}

</style></head><body><div id="root" data-duration="8.0"><div class="chrome-label"><span class="n">§4.1</span><span class="t">A sequence settles, or it does not</span></div>
<svg class="plane" viewBox="0 0 1280 720"><clipPath id="pc"><rect x="40" y="70" width="480" height="470"/></clipPath>
<g id="grid" clip-path="url(#pc)">
<line x1="108.6" y1="70" x2="108.6" y2="540" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="194.3" y1="70" x2="194.3" y2="540" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="280.0" y1="70" x2="280.0" y2="540" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="365.7" y1="70" x2="365.7" y2="540" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="451.4" y1="70" x2="451.4" y2="540" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="472.9" x2="520" y2="472.9" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="388.9" x2="520" y2="388.9" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="305.0" x2="520" y2="305.0" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="221.1" x2="520" y2="221.1" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="137.1" x2="520" y2="137.1" stroke="var(--grid)" stroke-width="1.5"/>
<line x1="40" y1="305.0" x2="520" y2="305.0" stroke="var(--axis)" stroke-width="2"/>
<line x1="280.0" y1="70" x2="280.0" y2="540" stroke="var(--axis)" stroke-width="2"/>
<circle cx="280.0" cy="305.0" r="171.4" fill="none" stroke="var(--axis)" stroke-width="2" stroke-dasharray="6 6"/>
</g>
<circle id="unit" r="1" fill="none"/><circle id="d0" r="7" fill="var(--cart)"/><circle id="d1" r="7" fill="var(--cart)"/><circle id="d2" r="7" fill="var(--cart)"/><circle id="d3" r="7" fill="var(--cart)"/><circle id="d4" r="7" fill="var(--cart)"/><circle id="d5" r="7" fill="var(--cart)"/><circle id="d6" r="7" fill="var(--cart)"/><circle id="d7" r="7" fill="var(--cart)"/><circle id="d8" r="7" fill="var(--cart)"/>
<circle id="cur" r="10" fill="var(--input)"/></svg><div id="l1" class="ln2 " style="top:88px">z^n. Watch the terms land.</div><div id="r1" class="ln2 in" style="top:140px" data-readout></div><div id="r2" class="ln2 " style="top:188px" data-readout></div><div id="r3" class="ln2 out" style="top:236px" data-readout></div><div id="r4" class="ln2 " style="top:300px" data-readout></div>
<div class="cite">Howell &amp; Mathews, Complex Analysis &sect;4.1, Definition 4.1.1. CC BY 4.0. PDF Definition 4.1.</div></div>
<script>
const tl=gsap.timeline({paused:true});tl.set({},{},8.0);

const PL={"x0": 40, "y0": 70, "w": 480, "h": 470, "xmin": -1.4, "xmax": 1.4, "ymin": -1.4, "ymax": 1.4};
const X=x=>PL.x0+(x-PL.xmin)/(PL.xmax-PL.xmin)*PL.w, Y=y=>PL.y0+(PL.ymax-y)/(PL.ymax-PL.ymin)*PL.h, U=PL.w/(PL.xmax-PL.xmin);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), ramp=(t,a,b)=>clamp((t-a)/(b-a),0,1), ease=u=>u*u*(3-2*u);
const $=id=>document.getElementById(id);
const op=(id,v)=>{const e=$(id); if(!e) return; e.style.opacity=String(Math.round(v*1000)/1000); e.classList.toggle('off', v<0.04);};
const num=(v,d=3)=>{let r=Math.round(v*Math.pow(10,d))/Math.pow(10,d); if(Object.is(r,-0)||Math.abs(r)<Math.pow(10,-d)/2) r=0; let s=r.toFixed(d); if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,''); return s.replace('-','\u2212');};
const deg=a=>num(a*180/Math.PI,1)+'\u00b0';
const cz=(re,im,d=3)=>{const a=num(re,d), b=num(Math.abs(im),d), neg=im<0&&b!=='0'; const ip=b==='1'?'i':b+'i';
  if(b==='0') return a; if(a==='0') return (neg?'\u2212':'')+ip; return a+(neg?' \u2212 ':' + ')+ip;};
const setLine=(id,x1,y1,x2,y2)=>{const e=$(id); e.setAttribute('x1',X(x1)); e.setAttribute('y1',Y(y1)); e.setAttribute('x2',X(x2)); e.setAttribute('y2',Y(y2));};
const setDot=(id,x,y)=>{const e=$(id); e.setAttribute('cx',X(x)); e.setAttribute('cy',Y(y));};
const setLbl=(id,x,y,dx,dy)=>{const e=$(id); if(!e) return; const pad=window.__planePad; if(document.documentElement.dataset.stack==='portrait'&&pad){e.style.left=((X(x)+dx-pad.vx)/pad.vw*100)+'%'; e.style.top=((Y(y)+dy-pad.vy)/pad.vh*100)+'%';}else{e.style.left=(X(x)+dx)+'px'; e.style.top=(Y(y)+dy)+'px';}};
const arc=(id,r,a0,a1)=>{const e=$(id); if(Math.abs(a1-a0)<1e-6){e.setAttribute('d','');return;} const n=Math.max(2,Math.ceil(Math.abs(a1-a0)/0.05)); let d='';
  for(let k=0;k<=n;k++){const a=a0+(a1-a0)*k/n; d+=(k?'L':'M')+X(r*Math.cos(a)).toFixed(1)+' '+Y(r*Math.sin(a)).toFixed(1);} e.setAttribute('d',d);};
const txt=(id,s)=>{const e=$(id); if(e.textContent!==s) e.textContent=s;};

const D=8;
function pw(){
  const P=window.__filmParams||{};
  const re=Number.isFinite(+P.re)?+P.re:0.5;
  const im=Number.isFinite(+P.im)?+P.im:0.25;
  const step=Math.min(1,Math.max(1e-5,Number.isFinite(+P.step)?+P.step:0.25));
  return {re, im, step};
}
function draw(t){
  const {re, im, step}=pw();
  op('grid',1); op('l1',1);
  const uR=U; $('unit').setAttribute('cx',X(0)); $('unit').setAttribute('cy',Y(0)); $('unit').setAttribute('r',uR);
  $('unit').setAttribute('fill','none'); $('unit').setAttribute('stroke','var(--axis)'); $('unit').setAttribute('stroke-dasharray','6 6');
  const target=Math.min(8,(t/D)*8);
  const shown=Math.floor(target/step+1e-9)*step;
  let x=1, y=0;
  const pts=[[1,0]];
  for(let k=1;k<=8;k++){ const nx=x*re-y*im, ny=x*im+y*re; x=nx; y=ny; pts.push([x,y]); }
  for(let k=0;k<=8;k++){
    const on=k<=shown+1e-9?1:0;
    op('d'+k,on*0.85); setDot('d'+k,pts[k][0],pts[k][1]);
  }
  const i=Math.min(8,Math.floor(shown));
  const f=Math.min(1,shown-i);
  const cx=pts[i][0]+(pts[Math.min(8,i+1)][0]-pts[i][0])*f;
  const cy=pts[i][1]+(pts[Math.min(8,i+1)][1]-pts[i][1])*f;
  setDot('cur',cx,cy); op('cur',1);
  const mod=Math.hypot(re,im);
  txt('r1','z = '+cz(re,im)+',  |z| = '+num(mod));
  txt('r2','terms shown: '+num(shown,4)+', step '+num(step,5));
  txt('r3','|z^n| = '+num(Math.hypot(cx,cy)));
  txt('r4', mod<1-1e-6?'Settles at 0. The modulus is |z|^n.':(Math.abs(mod-1)<1e-6?'Stays. The modulus is 1, so it does not settle.':'Leaves. The modulus is bigger than 1.'));
  op('r1',1); op('r2',1); op('r3',1); op('r4',1);
}

const T={t:0};tl.to(T,{t:8.0,duration:8.0,ease:'none',onUpdate:()=>draw(T.t)},0);tl.addLabel("start",0);tl.addLabel("mid",4);tl.addLabel("end",8.0);draw(8.0);window.__beats=[0, 4, 8.0];window.__shownT=Number(document.getElementById('root').dataset.duration)||0;const __draw=draw;draw=function(t){window.__shownT=t;__draw(t)};window.__redraw=function(){__draw(window.__shownT)};window.__onParams=function(p){window.__filmParams=p;};if(window.__filmFit)window.__filmFit(PL);
window.__tl=tl;</script><script src="shared/fit.js"></script><script src="shared/hostclock.js"></script></body></html>
